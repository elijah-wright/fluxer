name: 'Sync with upstream'

on:
  schedule:
  - cron:  '0 0 * * *'
  workflow_dispatch:

jobs:
  repo-sync:
    name: Repo sync
    runs-on: ubuntu-latest
    steps:
    - run: |
        echo repo_name=$(echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}') >> $GITHUB_ENV
        echo upstream_branch=$(echo "$GITHUB_REF_NAME") >> $GITHUB_ENV
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - uses: repo-sync/github-sync@v2
      name: Sync repo to branch
      with:
        source_repo: "fluxerapp/${{ env.repo_name }}"
        source_branch: ${{ env.upstream_branch }}
        destination_branch: repo-sync
        github_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Check for changes
      run: |
        if [ "$(git rev-parse --revs-only origin/repo-sync)" != "$(git merge-base $GITHUB_REF_NAME origin/repo-sync)" ]; then
          echo changes_exist=true >> $GITHUB_ENV
        fi
    - uses: repo-sync/pull-request@v2
      name: Create pull request
      if: env.changes_exist == 'true'
      with:
        source_branch: repo-sync
        destination_branch: ${{ github.ref_name }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
        pr_title: "Sync with upstream"
